[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-rainbow-deck"
version = "0.1.0"
description = "Pi Rainbow Deck macro pad and host bridge for Claude Code"
readme = "README.MD"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
host = [
    "pyautogui>=0.9.54; sys_platform == 'win32' or sys_platform == 'linux'",
]
pi = [
    "rainbowhat",
]

[project.scripts]
pi-rainbow-deck-host = "pi_rainbow_deck_host.bridge:main"
pi-rainbow-deck-pi = "pi_rainbow_deck_pi.main:main"

[dependency-groups]
dev = [
    "pre-commit>=4.2",
    "pytest>=8.0",
    "ruff>=0.11.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_rainbow_deck_host", "src/pi_rainbow_deck_pi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
